<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden;height:100%}#gl{width:100%;height:100%;display:block;touch-action:none}</style>
</head><body>
<canvas id="gl"></canvas>
<script src="three.min.js"></script>
<script>
(function(){
var cv=document.getElementById('gl');
var renderer=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(38,1,0.1,100); camera.position.set(0,0.15,7.2);
/* shield shape */
function shieldShape(){var s=new THREE.Shape();var w=1.55,h=2.0;
 s.moveTo(0,-h);
 s.bezierCurveTo(w*0.55,-h*0.72,w,-h*0.35,w,-h*0.05);
 s.lineTo(w,h*0.38);
 s.bezierCurveTo(w*0.62,h*0.52,w*0.34,h*0.60,0,h*0.72);
 s.bezierCurveTo(-w*0.34,h*0.60,-w*0.62,h*0.52,-w,h*0.38);
 s.lineTo(-w,-h*0.05);
 s.bezierCurveTo(-w,-h*0.35,-w*0.55,-h*0.72,0,-h);
 return s;}
var group=new THREE.Group(); scene.add(group);
var geo=new THREE.ExtrudeGeometry(shieldShape(),{depth:0.34,bevelEnabled:true,bevelThickness:0.10,bevelSize:0.07,bevelSegments:3,steps:1});
geo.center();
var mat=new THREE.MeshPhysicalMaterial({color:0x0b2a52,metalness:0.55,roughness:0.28,transparent:true,opacity:0.96,clearcoat:0.7});
var shield=new THREE.Mesh(geo,mat); group.add(shield);
var edges=new THREE.LineSegments(new THREE.EdgesGeometry(geo,18),new THREE.LineBasicMaterial({color:0x27e1ff,transparent:true,opacity:0.95}));
group.add(edges);
/* S logo texture */
new THREE.TextureLoader().load('sovra_s.png',function(tex){
 var m=new THREE.Mesh(new THREE.PlaneGeometry(1.55,1.55),new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:0.97}));
 m.position.z=0.30; group.add(m);
});
/* glow sprite */
function glowTex(){var c=document.createElement('canvas');c.width=c.height=256;var g=c.getContext('2d');
 var gr=g.createRadialGradient(128,128,10,128,128,128);gr.addColorStop(0,'rgba(80,200,255,0.85)');gr.addColorStop(1,'rgba(80,200,255,0)');
 g.fillStyle=gr;g.fillRect(0,0,256,256);return new THREE.CanvasTexture(c);}
var glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(),color:0x27e1ff,transparent:true,opacity:0.5,depthWrite:false,blending:THREE.AdditiveBlending}));
glow.scale.set(6.4,6.4,1); glow.position.z=-1.4; scene.add(glow);
/* rings */
var rings=new THREE.Group();
var rMat=new THREE.MeshBasicMaterial({color:0x27e1ff,transparent:true,opacity:0.5});
[2.35,2.7].forEach(function(r,i){var ring=new THREE.Mesh(new THREE.TorusGeometry(r,0.016,8,110),rMat.clone());ring.rotation.x=Math.PI/2.35+i*0.22;rings.add(ring);});
scene.add(rings);
/* particles */
var N=260,pos=new Float32Array(N*3);
for(var i=0;i<N;i++){var a=Math.random()*Math.PI*2,r=2.1+Math.random()*1.7;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=(Math.random()-0.5)*3.6;pos[i*3+2]=Math.sin(a)*r;}
var pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
var pMat=new THREE.PointsMaterial({color:0x8fe9ff,size:0.045,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false});
var parts=new THREE.Points(pg,pMat); scene.add(parts);
scene.add(new THREE.AmbientLight(0x2a3f6a,1.4));
var l1=new THREE.PointLight(0x27e1ff,2.4,18); l1.position.set(-3.5,2.5,4.5); scene.add(l1);
var l2=new THREE.PointLight(0x7b5cff,2.0,18); l2.position.set(3.5,-2.5,3.5); scene.add(l2);
var dl=new THREE.DirectionalLight(0xffffff,0.8); dl.position.set(0,3,6); scene.add(dl);
function resize(){var w=cv.clientWidth||window.innerWidth,h=cv.clientHeight||window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize); resize();
/* drag to rotate */
var drag=false,px=0,py=0,ry=0,rx=-0.06;
cv.addEventListener('pointerdown',function(e){drag=true;px=e.clientX;py=e.clientY;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',function(e){if(!drag)return;ry+=(e.clientX-px)*0.012;rx+=(e.clientY-py)*0.008;rx=Math.max(-0.7,Math.min(0.7,rx));px=e.clientX;py=e.clientY;});
['pointerup','pointercancel'].forEach(function(n){cv.addEventListener(n,function(){drag=false})});
/* state from Android */
var conn=false,paused=false;
var cA=new THREE.Color(0x27e1ff),cB=new THREE.Color(0x3dffa8),cur=new THREE.Color(0x27e1ff);
window.setConnected=function(v){conn=!!v;};
window.setPaused=function(v){paused=!!v; if(!paused){t0=performance.now(); requestAnimationFrame(loop);}};
var t0=performance.now();
function loop(now){ if(paused) return; requestAnimationFrame(loop); if(document.hidden) return;
 var t=(now-t0)/1000; cur.lerp(conn?cB:cA,0.06);
 edges.material.color.copy(cur); glow.material.color.copy(cur); l1.color.copy(cur);
 rings.children.forEach(function(r){r.material.color.copy(cur);});
 pMat.color.copy(cur).lerp(new THREE.Color(0xffffff),0.35);
 if(!drag){ry+=(Math.sin(t*0.5)*0.45-ry)*0.02; rx+=(-0.06-rx)*0.04;}
 group.rotation.y=ry; group.rotation.x=rx;
 var br=1+Math.sin(t*(conn?2.6:1.5))*(conn?0.025:0.012); group.scale.setScalar(br);
 glow.material.opacity=(conn?0.75:0.5)+Math.sin(t*2)*0.08;
 rings.rotation.z=t*(conn?0.5:0.18); parts.rotation.y=t*(conn?0.35:0.08);
 renderer.render(scene,camera);}
requestAnimationFrame(loop);
})();
</script>
</body></html>
